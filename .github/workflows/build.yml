name: Build Fenix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: script -q -c "flet build apk" /dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-apk
          path: build/apk/app-release.apk
