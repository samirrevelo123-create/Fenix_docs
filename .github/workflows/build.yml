name: Build Fenix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: flet build apk

      - name: Find APK
        run: |
          echo "APK generado:"
          find build -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fenix-apk
          path: build/**/*.apk
          
