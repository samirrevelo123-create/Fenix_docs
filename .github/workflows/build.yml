name: Build Fenix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: flet build apk

      - name: Check APK
        run: |
          echo "Archivos APK encontrados:"
          find build -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-apk
          path: build/**/*.apk
