name: Build Fenix APK

on:
  workflow_dispatch:

env:
  FLET_CLI_NO_RICH_OUTPUT: "1"
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: |
          which flutter
          flutter --version

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Flet
        run: pip install --upgrade "flet[all]"

      - name: Verify Flet
        run: |
          flet --version
          flet doctor

      - name: Build APK
        run: flet build apk --clear-cache

      - name: Find APK
        run: |
          echo "========== APK =========="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fenix-apk
          path: |
            build/**/*.apk
            build/*.apk
          if-no-files-found: error
